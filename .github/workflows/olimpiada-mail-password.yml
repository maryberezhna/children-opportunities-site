name: Олімпіада — пароль пошти для сайту

# Сайт шле запрошення до олімпіади сам (lib/olimpiada-mail.js), і йому
# потрібен пароль застосунку пошти проєкту. Він є лише в секретах GitHub, а
# змінних Vercel звідси не задати — тож цей воркфлоу кладе пароль у Supabase
# Vault (зашифровано, читає лише сервісний ключ). Запускати вручну: 1 раз
# і щоразу, як міняється DITYAM_GMAIL_APP_PASSWORD. Пароль у журнал не
# потрапляє — лише код відповіді бази.
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Перенести пароль у Supabase Vault
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DITYAM_GMAIL_APP_PASSWORD: ${{ secrets.DITYAM_GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$DITYAM_GMAIL_APP_PASSWORD" ]; then echo "Секрету DITYAM_GMAIL_APP_PASSWORD немає"; exit 1; fi
          code=$(jq -n --arg p "$DITYAM_GMAIL_APP_PASSWORD" '{p: $p}' | curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/olimp_mail_password_set" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" --data @-)
          echo "Відповідь бази: $code"
          [ "$code" = "204" ] || [ "$code" = "200" ]
