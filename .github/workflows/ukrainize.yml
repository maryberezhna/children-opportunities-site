name: Переклад записів українською (вручну)

# Записи, що лежать англійською (Eurodesk та інші англомовні джерела), —
# українською: назва, короткий і повний опис. Див. scraper/ukrainize.py.
#
# Два кроки, і записується РІВНО те, що прочитала людина:
#   1. apply=false — сухий прогін: модель перекладає, пропозиції лягають в
#      артефакт «ukrainize-proposals» цього прогону. Прочитати лог.
#   2. apply=true, from_run=<номер прогону з кроку 1> — записати пропозиції
#      того прогону без нового виклику моделі (Sonnet 5 не дає зафіксувати
#      температуру — повторний виклик переклав би інакше). skip — частини
#      назв через «|», які не записувати.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = записати пропозиції прогону from_run; false = сухий прогін'
        required: false
        default: 'false'
      from_run:
        description: 'номер сухого прогону, чиї пропозиції записати'
        required: false
        default: ''
      include_verified:
        description: 'true = перекладати й записи, схвалені людиною'
        required: false
        default: 'false'
      skip:
        description: 'не записувати: частини назв через |'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  ukrainize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Пропозиції сухого прогону
        if: github.event.inputs.apply == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ukrainize-proposals
          path: scraper
          run-id: ${{ github.event.inputs.from_run }}
          github-token: ${{ github.token }}
      - name: Ukrainize
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UKRAINIZE_SKIP: ${{ github.event.inputs.skip }}
        run: >-
          python ukrainize.py
          ${{ github.event.inputs.apply == 'true' && '--apply --from-file ukrainize-proposals.json' || '' }}
          ${{ github.event.inputs.include_verified == 'true' && '--include-verified' || '' }}
      - name: Зберегти пропозиції
        if: github.event.inputs.apply != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ukrainize-proposals
          path: scraper/ukrainize-proposals.json
          retention-days: 14
