# Сітка №2: алерт у Telegram, коли деплой main падає (01.09.2026 між
# поломкою і виявленням минуло пів дня — виявили випадково). Vercel шле
# commit status; фільтруємо лише main і лише сам деплой, не коментарі.
#
# 20.09.2026: скасована збірка більше не називається падінням. Vercel шле
# state=failure і для скасування («Canceled from the Vercel Dashboard»), а
# скасовує він переважно сам: коли за хвилину після мержу приходить новіший
# коміт, стара збірка зупиняється, і деплоїться новіша. Таке повідомлення з
# «🔴 упав» лякало без причини.
#
# 14.09.2026: з 01.09 цей воркфлоу НЕ ПРАЦЮВАВ ЖОДНОГО РАЗУ. Рядки
# повідомлення стояли в блоці run: без відступу — YAML невалідний, GitHub
# не міг розібрати файл, і кожна подія статусу давала червоний запуск без
# жодного джобу (30 з 30, нуль успішних). Алерт про зламаний деплой просто
# не міг прийти. Тепер текст збирається в скрипті зі змінних оточення: YAML
# цілий, а дані з події не підставляються в shell напряму.
name: deploy-alert
on:
  status
jobs:
  alert:
    if: >
      (github.event.state == 'failure' || github.event.state == 'error') &&
      github.event.context == 'Vercel' &&
      contains(join(github.event.branches.*.name, ','), 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DESCRIPTION: ${{ github.event.description }}
          TARGET_URL: ${{ github.event.target_url }}
          COMMIT_MESSAGE: ${{ github.event.commit.commit.message }}
        run: |
          # Скасування — не падіння: інший тон, інший знак і підказка, чому так.
          case "$DESCRIPTION" in
            *ancel*|*касован*)
              TEXT=$(printf '⚪️ Деплой main скасовано: %s\n%s\nКоміт: %s\n\nЗазвичай це означає, що одразу після цього коміта прийшов новіший — деплоїться він. Перевірити варто, лише якщо новішого коміта не було.' "$DESCRIPTION" "$TARGET_URL" "$COMMIT_MESSAGE")
              ;;
            *)
              TEXT=$(printf '🔴 Деплой main упав: %s\n%s\nКоміт: %s' "$DESCRIPTION" "$TARGET_URL" "$COMMIT_MESSAGE")
              ;;
          esac
          curl -s "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode chat_id="${CHAT}" \
            --data-urlencode text="${TEXT}" >/dev/null
          echo "alert sent"
