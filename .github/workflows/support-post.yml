name: Telegram — weekly support post

# ВИМКНЕНО ЗА РОЗКЛАДОМ 19.08.2026: у суботу це був другий пост за день.
# Прохання про підтримку тепер живе рядком у самому дайджесті (раз на тиждень,
# у неділю) — scripts/check-deadlines.mjs. Ручний запуск лишається.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print message without sending'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Post support reminder to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/post-support-message.mjs
