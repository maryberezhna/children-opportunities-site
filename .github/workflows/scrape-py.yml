name: Scrape opportunities (Python)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Без цього вивід Python буферизується, і коли прогін убиває по таймауту,
  # у логах не лишається нічого: 30.08 після падіння не було видно навіть,
  # на якому джерелі все спинилось.
  PYTHONUNBUFFERED: '1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 30 хвилин перестало вистачати, коли додались три переліки гуртків:
    # черга екстракції виросла до 653 записів, і прогін убивало посеред
    # роботи — разом із підсумком і звітом у чат. Сам скрипт зупиняється за
    # EXTRACT_BUDGET_SEC, тож цей таймаут — лише страховка зверху.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r requirements.txt

      # Браузер потрібен рівно одному джерелу — Eurodesk: його сайт малюється
      # на клієнті, у відповіді по HTTP немає ні програм, ні посилань.
      # Кешуємо, щоб не тягнути ~130 МБ щоночі.
      - name: Кеш браузера Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('scraper/requirements.txt') }}

      - name: Встановити Chromium для Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Звіт іде в Telegram-бот; email — запасний канал, якщо Telegram упав
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: mashaberezhna0209@gmail.com
          # Google Alerts — RSS-стрічки з особистим токеном, тому в секретах.
          # Формат: назва|url, кілька через кому.
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
          # Instagram monitor (опціонально). Сесія — з gen_instagram_session.py;
          # password-логін лишається запасним шляхом.
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          # Facebook Graph API (опціонально)
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          # Скільки часу відводимо на LLM-екстракцію черги. Менше за
          # timeout-minutes, щоб скрипт устиг сам зупинитись, надрукувати
          # підсумок і надіслати звіт — а не був убитий посеред роботи.
          EXTRACT_BUDGET_SEC: '2400'
        run: python main.py
