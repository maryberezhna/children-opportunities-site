name: Пропозиції можливостей від людей

# Форма на сайті писала пропозицію в базу й слала сповіщення в адмінський
# чат — і на цьому все закінчувалось. 12.09.2026 Seniv Studio надіслала два
# дитячі вокальні конкурси, лишила пошту й не отримала ні відповіді, ні своєї
# можливості на сайті. Чотири пропозиції за весь час лежали як «new».
#
# Тепер кожна проходить той самий шлях, що й будь-яка знахідка скрапера:
# сторінка читається, нормалізатор витягає поля за правилом «нічого не
# вигадувати», запис лягає чернеткою в чергу модерації. Відправнику йде лист.
#
# Кожні три години, бо розклад GitHub запізнюється на кілька годин, а людина,
# яка щойно заповнила форму, чекає на відповідь сьогодні, а не завтра.
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = писати в базу й слати листи; false = лише дамп'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  suggestions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Опрацювати пропозиції
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: mashaberezhna0209@gmail.com
        # За розкладом завжди пишемо; вручну — лише якщо попросили apply=true.
        run: |
          if [ "${{ github.event.inputs.apply }}" = "false" ]; then
            python process_suggestions.py
          else
            python process_suggestions.py --apply
          fi
