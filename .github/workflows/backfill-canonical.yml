name: Backfill canonical URLs

# Щодня о 04:40 UTC. Був одноразовим, але 20.09.2026 знайшлись 6 активних
# записів без canonical_url: конвеєр його ставить, а ручні й агентські вставки
# — ні. Без канонічної адреси запис невидимий для дедуплікації. Прогін
# ідемпотентний і бере лише рядки з порожнім полем, тож коштує майже нічого.
on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print actions without writing to DB'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Backfill canonical_url
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/backfill-canonical.mjs
