name: Dityam+ — personal alerts (daily)

# Шле активним підписникам НОВІ можливості під профіль дитини. Якщо нового
# нема — нічого не надсилає. Ручний запуск — з dry_run для тесту.
#
# Три записи cron із тієї ж причини, що й у deadline-reminders: розклад
# GitHub Actions тут запізнюється на 4-5 годин (заміряно 11.09.2026,
# подробиці в scraper/send_window.py). Ворота SEND_AFTER_HOUR відсікають
# запуски раніше 10:00 за Києвом, повтору не буде через last_sent_at.
#
# Добірка може піти до нічного скрапу того ж дня — тоді свіжі знахідки
# поїдуть наступного разу. Це відставання на добу, і воно саме себе
# виправляє: скрипт бере все, що зʼявилось після last_sent_at.
on:
  schedule:
    - cron: '41 4 * * *'
    - cron: '41 6 * * *'
    - cron: '41 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = нічого не слати, лише лог'
        required: false
        default: 'false'
      any_time:
        description: 'true = слати негайно, не чекати вікна 10:00 Київ'
        required: false
        default: 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Send personal digests
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: mashaberezhna0209@gmail.com
          SITE_URL: https://dityam.com.ua
          SEND_AFTER_HOUR: '10'
        run: |
          ANY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.any_time }}" != "false" ]; then
            ANY="--any-time"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python personal_digest.py --dry-run
          else
            python personal_digest.py $ANY
          fi
