name: Журнал оплат — перенести з WayForPay (разово)

# Переносить успішні оплати з кабінету WayForPay у таблицю payments, щоб у
# /admin/lyudy була історія від першого дня (scraper/payments_backfill.py).
# Без confirm = WRITE лише показує, що знайшов. Повторний запуск не задвоює.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'WRITE — записати в базу; порожньо — лише показати'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill payments
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WAYFORPAY_MERCHANT_ACCOUNT: ${{ secrets.WAYFORPAY_MERCHANT_ACCOUNT }}
          WAYFORPAY_SECRET_KEY: ${{ secrets.WAYFORPAY_SECRET_KEY }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" = "WRITE" ]; then
            python payments_backfill.py --write
          else
            python payments_backfill.py
          fi
