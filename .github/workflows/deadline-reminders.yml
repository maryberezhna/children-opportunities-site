name: Dityam+ — deadline reminders (daily)

# Нагадує підписникам про можливості, до подачі яких лишилось 7 або 2 дні.
# Це та частина обіцянки «ми нагадаємо», за яку люди платять: втрачають не
# через незнання, а через «потім».
#
# ЧОМУ ТРИ ЗАПИСИ CRON, А НЕ ОДИН. Розклад GitHub Actions для цього
# репозиторію не виконується: заміряно 11.09.2026 по журналу прогонів —
# «06:00» стабільно спрацьовує о 10:04-11:47, «щогодини» виходить раз на
# ~4.5 години. Затримка тримається щодня щонайменше десять днів поспіль.
# З одним записом о 07:00 нагадування йшло близько 15:00 за Києвом замість
# обіцяної десятої.
#
# Три ранкові запити дають бодай один запуск у потрібному вікні і за
# швидкого, і за повільного GitHub:
#   швидкий:  02:11 і 04:11 відсіють ворота, 06:11 UTC = 09:11 Київ — шле;
#   повільний: 02:11 прийде о 06:41-07:59 UTC = 09:41-10:59 Київ — шле.
# Зайві запуски того самого дня нічого не надішлють: пара
# (підписник × можливість × вікно) захищена UNIQUE у digest_reminders_sent,
# а ранні відсікає SEND_AFTER_HOUR (scraper/send_window.py).
on:
  schedule:
    - cron: '11 2 * * *'
    - cron: '11 4 * * *'
    - cron: '11 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = нічого не слати, лише лог'
        required: false
        default: 'false'
      demo:
        description: 'true = синтетичні профілі (перевірка без підписників)'
        required: false
        default: 'false'
      days:
        description: 'однакові вікна для всіх типів через кому, напр. 7,2 — лише для тесту; порожньо = за типом програми'
        required: false
        default: ''
      any_time:
        description: 'true = слати негайно, не чекати вікна 9:00 Київ'
        required: false
        default: 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Send deadline reminders
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Шлемо з платного бота — підписник оформлює Dityam+ саме в ньому.
          # Основний лишається запасним (див. send_telegram у personal_digest.py).
          TELEGRAM_PLUS_BOT_TOKEN: ${{ secrets.TELEGRAM_PLUS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Пошта проєкту, щойно заведено її пароль застосунку (секрет
          # DITYAM_GMAIL_APP_PASSWORD); доти — особиста, як і раніше.
          GMAIL_APP_PASSWORD: ${{ secrets.DITYAM_GMAIL_APP_PASSWORD || secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: ${{ secrets.DITYAM_GMAIL_APP_PASSWORD && 'hellodityam.com.ua@gmail.com' || 'mashaberezhna0209@gmail.com' }}
          SITE_URL: https://dityam.com.ua
          # Раніше за цю годину за Києвом нічого не шлемо — див. коментар
          # про розклад вище. 0 вимкнув би ворота повністю.
          SEND_AFTER_HOUR: '9'
        run: |
          # Порожньо — вікна за типом програми (стипендії й обміни за 28/14/3
          # дні, конкурси за 14/3, гуртки за 7/2). До 14.09.2026 тут стояв
          # запасний «7,2», і запуск за розкладом, де inputs порожні, примусово
          # слав усім «за тиждень і за два дні» — обіцянка на /plus не діяла.
          DAYS_ARG=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            DAYS_ARG="--days ${{ github.event.inputs.days }}"
          fi
          # Ручний запуск за замовчуванням шле одразу: людина натиснула
          # кнопку свідомо, змушувати її чекати ранку безглуздо.
          ANY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.any_time }}" != "false" ]; then
            ANY="--any-time"
          fi
          if [ "${{ github.event.inputs.demo }}" = "true" ]; then
            python deadline_reminders.py --demo $DAYS_ARG
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python deadline_reminders.py --dry-run $DAYS_ARG
          else
            python deadline_reminders.py $DAYS_ARG $ANY
          fi
