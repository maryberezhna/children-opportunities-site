name: Scrape opportunities

# Розклад знято 15.09.2026, лишився ручний запуск. З 02.09 (CHECK на format,
# PR #166) кожен прогін падав на всіх 8 рядках — джерела пишуть формат
# текстом («Онлайн (заявка)», «Офлайн, Київ») — а сам прогін лишався
# зеленим. Лагодити формат небезпечно: ці записи без віку, дати й вартості
# і пишуться напряму з default status 'active', тобто в обхід пʼяти
# обовʼязкових полів (lib/required.js). Скраперові потрібні спершу ворота.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run scrapers + upsert to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: npm run scrape

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunities-csv
          path: scrapers/output/*
          if-no-files-found: warn
          retention-days: 30
