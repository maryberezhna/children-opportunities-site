name: Перерозмітка каталогу (вручну)

# Проходить активні записи і уточнює за їхнім джерелом те, чого стара
# екстракція не зберігала: дати ПРОВЕДЕННЯ окремо від дедлайну подачі,
# посилання на форму подачі, розгорнутий опис, вартість словами.
#
# Текст бере спершу з raw_items (дві третини записів), і лише для решти
# йде на сторінку джерела — тому прогін дешевший і добріший до чужих сайтів,
# ніж здається з кількості записів.
#
# Без розкладу: це разова операція на весь каталог, а не щоденна робота.
# Нову розмітку для нових записів робить уже сам нормалізатор.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = писати в базу; false = сухий прогін'
        required: false
        default: 'false'
      limit:
        description: 'скільки записів за прогін'
        required: false
        default: '50'
      only_dates:
        description: 'true = чіпати лише дати, не заповнювати details'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Remark
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '50' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ github.event.inputs.only_dates }}" = "true" ]; then ARGS="$ARGS --only-dates"; fi
          python remark.py $ARGS
