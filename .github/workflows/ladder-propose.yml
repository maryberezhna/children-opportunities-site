name: Dityam+ — наступна сходинка (daily)

# Модель пропонує звʼязки «після X → Y» з наявних записів, а в адмін-бот
# приходять картки «Наступна сходинка? ✅ / ❌». У добірку Dityam+ іде лише
# підтверджене (рішення Марії 27.09.2026). Див. scraper/ladder_propose.py.
#
# Скільки: 5 програм і до 5 карток за запуск, і не більше 10 карток без
# відповіді — модерація має вкладатись у ~10 хвилин на день. Ціну кожного
# запуску скрипт друкує в лог.
#
# Ручний запуск за замовчуванням СУХИЙ: модель питаємо, а в базу нічого не
# пишемо й карток не шлемо — щоб подивитись якість і ціну.
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише лог: що запропонувала б модель і скільки коштувало'
        required: false
        default: 'true'
      limit:
        description: 'скільки програм розглянути'
        required: false
        default: '5'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Propose next steps
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Картки йдуть в адмін-бот «Dityam Адмінка 🛠»: його вебхук і
          # обробляє кнопки lad:yes / lad:no.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_URL: https://dityam.com.ua
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            python ladder_propose.py --dry-run --limit "$LIMIT"
          else
            python ladder_propose.py --limit "$LIMIT"
          fi
