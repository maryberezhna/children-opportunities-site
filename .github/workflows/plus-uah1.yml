name: Dityam+ — перший місяць 1 грн (разово)

# Разове повідомлення про перший місяць Dityam+ за 1 грн (Марія, 08.10.2026)
# тим, хто зупинився в оформленні, і списку очікування з @DityamPlusBot.
# Кому саме й чому — у scraper/plus_uah1.py. Без confirm = SEND нічого не
# шле — лише лог, кому й що пішло б. Повторний SEND напише всім ще раз.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'SEND — надіслати по-справжньому; порожньо — лише показати, кому й що'
        required: false
        default: ''
      preview_chat:
        description: 'chat_id — надіслати обидва тексти лише сюди (показати); тоді confirm ігнорується'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Notify about 1 UAH first month
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_PLUS_BOT_TOKEN: ${{ secrets.TELEGRAM_PLUS_BOT_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.preview_chat }}" ]; then
            python plus_uah1.py --preview "${{ github.event.inputs.preview_chat }}"
          elif [ "${{ github.event.inputs.confirm }}" = "SEND" ]; then
            python plus_uah1.py --send
          else
            python plus_uah1.py
          fi
