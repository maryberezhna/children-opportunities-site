name: Backfill «хто може подати» (manual)

# «Чи може подати дитина з України» для закордонних і міжнародних записів:
# ua_eligibility / ua_eligibility_note. Дивись scraper/backfill_ua_eligibility.py.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише лог, без запису'
        required: false
        default: 'false'
      limit:
        description: 'скільки записів (порожньо = всі)'
        required: false
        default: ''
      ids:
        description: 'лише ці записи, id через кому (переписує наявні поля)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LIMIT: ${{ github.event.inputs.limit }}
          IDS: ${{ github.event.inputs.ids }}
        run: python backfill_ua_eligibility.py
