name: Дозаповнення чернеток з тексту (вручну)

# Чернетки в черзі модерації з «бракує: …», хоча відповідь стоїть у назві чи
# описі (місто, вартість, вік, тип, «щороку»). Правила — scraper/text_fill.py,
# ті самі, що в нормалізаторі для нових записів. Статус не змінюється.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = записати; false = лише показати'
        required: false
        default: 'false'

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fill from text
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fill_from_text.py ${{ github.event.inputs.apply == 'true' && '--apply' || '' }}
