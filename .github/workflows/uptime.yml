name: Uptime check

on:
  schedule:
    - cron: '19 * * * *'  # щогодини, непарна хвилина свідомо
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          FAILS=""
          for path in "/" "/kategorii" "/o/unicef-upshift-sotsialni-proekty-molodi-a65a9d" "/llms.txt"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://dityam.com.ua$path" || echo "000")
            if [ "$code" != "200" ]; then
              # повтор через 30с — не алертимо на одиничний мережевий чих
              sleep 30
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://dityam.com.ua$path" || echo "000")
              if [ "$code" != "200" ]; then
                FAILS="$FAILS• dityam.com.ua$path → HTTP $code%0A"
              fi
            fi
          done
          if [ -n "$FAILS" ]; then
            echo "DOWN: $FAILS"
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ]; then
              curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_ADMIN_CHAT_ID" \
                -d text="🔴 dityam.com.ua має проблеми:%0A$FAILS(перевірено двічі з інтервалом 30с)" >/dev/null
            fi
            exit 1
          fi
          echo "✅ Всі сторінки відповідають 200"
