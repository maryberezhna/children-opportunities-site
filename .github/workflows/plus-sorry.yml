name: Dityam+ — вибачення за «оплату» 21.10 (разово)

# Разове вибачення тим, кому бот 21.10.2026 писав про оплату, хоч Dityam+ уже
# безкоштовний. Кому саме й чому — у scraper/plus_sorry.py. Без confirm = SEND
# нічого не шле. preview_chat — показати обидва тексти в один чат.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'SEND — надіслати по-справжньому; порожньо — лише показати, кому й що'
        required: false
        default: ''
      preview_chat:
        description: 'chat_id — надіслати обидва тексти лише сюди (показати); тоді confirm ігнорується'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Send apology
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWN_CHAT_IDS: ${{ secrets.OWN_CHAT_IDS }}
          TELEGRAM_PLUS_BOT_TOKEN: ${{ secrets.TELEGRAM_PLUS_BOT_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.preview_chat }}" ]; then
            python plus_sorry.py --preview "${{ github.event.inputs.preview_chat }}"
          elif [ "${{ github.event.inputs.confirm }}" = "SEND" ]; then
            python plus_sorry.py --send
          else
            python plus_sorry.py
          fi
