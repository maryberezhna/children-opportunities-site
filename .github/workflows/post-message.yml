name: Пост у канал із файлу

# Публікує готовий текст із content/telegram/. Написати новий пост = додати
# туди файл і запустити цей воркфлоу з його імʼям — окремий скрипт і окремий
# воркфлоу під кожен пост більше не потрібні.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Файл із текстом, напр. content/telegram/build-future.html'
        required: true
      dry_run:
        description: 'true = лише показати текст, не публікувати'
        required: false
        default: 'true'
      pin:
        description: 'true = закріпити пост у каналі після відправки'
        required: false
        default: 'false'
      message_id:
        description: 'Номер уже опублікованого поста, щоб виправити його текст (порожньо = новий пост)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      # telegram-counters.mjs (живі числа в тексті) імпортує @supabase/supabase-js:
      # без npm ci скрипт падає ще до читання файлу.
      - run: npm ci
      - name: Опублікувати
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE: ${{ github.event.inputs.file }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PIN: ${{ github.event.inputs.pin }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: node scripts/post-message.mjs
