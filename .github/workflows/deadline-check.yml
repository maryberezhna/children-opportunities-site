name: Deadline check

on:
  # Три пости на день, кожен своїм запуском (Марія, 05.10.2026: «дедлайни,
  # які закінчуються на цьому тижні; нова можливість; підбірки»). До цього —
  # два (17.09.2026), а ще раніше обидва йшли одним запуском із різницею в
  # секунду.
  #
  # Хвилини не нульові навмисно: GitHub пише, що розклад найчастіше
  # запізнюється на початку години. Рядки '0 6' і '0 14' приходили на 3–5
  # годин пізніше (пости о 13:40–15:40 і 20:00–23:20 за Києвом).
  # Час нижче — київський літній (UTC+3); після 25.10 — на годину раніше.
  schedule:
    - cron: '23 5 * * *'   # «⏰ Дедлайни цього тижня»: 08:23
    - cron: '41 9 * * *'   # підбірка дня: 12:41
    - cron: '17 14 * * *'  # «🆕 Нова можливість»: 17:17
  workflow_dispatch:
    inputs:
      preview:
        description: 'Показати пости за планом на 14 днів уперед, нічого не надсилаючи'
        required: false
        default: 'false'
      dry_run:
        description: 'Print actions without writing to DB'
        required: false
        default: 'false'
      notify:
        description: 'Post a Telegram digest of items due within 7 days'
        required: false
        default: 'true'
      post:
        description: 'Який пост: deadlines (дедлайни тижня), digest (підбірка), new (нова можливість) або all'
        required: false
        default: 'all'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Перед публікацією скрипт читає сторінку джерела кожної можливості,
      # яку збирається надіслати (scripts/verify-before-post.mjs запускає
      # scraper/lifecycle.py --ids). Без Python пост не піде — і це навмисно:
      # 20.09.2026 у канал пішла літня школа, що скінчилась 20 серпня.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Перевірити порядок оголошень у скрипті
        run: node scripts/check-script-order.mjs

      - name: Audit & archive deadlines
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Превʼю нічого не шле — там перевірка сторінок зайва (це 14 постів
          # наперед, тобто десятки звернень до моделі даремно).
          PUBLISH_CHECK: ${{ github.event.inputs.preview == 'true' && 'off' || 'on' }}
          NOTIFY: ${{ github.event.inputs.notify || 'true' }}
          PREVIEW: ${{ github.event.inputs.preview || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Розклад, якого вже немає у файлі (старий '0 6', що спізнився на години
          # після зміни 05.10.2026), не шле нічого: інакше він став би «all» і
          # надіслав усі три пости разом.
          POST: ${{ github.event.schedule == '23 5 * * *' && 'deadlines' || github.event.schedule == '41 9 * * *' && 'digest' || github.event.schedule == '17 14 * * *' && 'new' || github.event_name == 'schedule' && 'none' || github.event.inputs.post || 'all' }}
        run: node scripts/check-deadlines.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-report
          path: scripts/output/*.txt
          if-no-files-found: ignore
          retention-days: 30
