name: Deadline check

on:
  # Два пости — у різний час (рішення Марії 17.09.2026): до цього обидва йшли
  # одним запуском із різницею в секунду. GitHub запускає розклад із
  # запізненням до ~5 годин, тож зазор великий: навіть якщо ранковий запуск
  # спізниться до 11:00 UTC, а вечірній прийде вчасно, між постами — 3 години.
  schedule:
    - cron: '0 6 * * *'   # тематичний пост дня: 09:00 Kyiv (літо)
    - cron: '0 14 * * *'  # «🆕 Нова можливість»: 17:00 Kyiv (літо)
  workflow_dispatch:
    inputs:
      preview:
        description: 'Показати пости за планом на 14 днів уперед, нічого не надсилаючи'
        required: false
        default: 'false'
      dry_run:
        description: 'Print actions without writing to DB'
        required: false
        default: 'false'
      notify:
        description: 'Post a Telegram digest of items due within 7 days'
        required: false
        default: 'true'
      post:
        description: 'Який пост: digest (тематичний), new (Нова можливість) або both'
        required: false
        default: 'both'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Перевірити порядок оголошень у скрипті
        run: node scripts/check-script-order.mjs

      - name: Audit & archive deadlines
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY: ${{ github.event.inputs.notify || 'true' }}
          PREVIEW: ${{ github.event.inputs.preview || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          POST: ${{ github.event.schedule == '0 14 * * *' && 'new' || (github.event_name == 'schedule' && 'digest' || github.event.inputs.post || 'both') }}
        run: node scripts/check-deadlines.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-report
          path: scripts/output/*.txt
          if-no-files-found: ignore
          retention-days: 30
