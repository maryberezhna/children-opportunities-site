name: Перевірка дат по живих сторінках (щотижня)

# Другий крок після «Дозаповнення дат». Той читає лише те, що вже лежить у
# базі, і тому на прогоні 11.09.2026 із 120 записів визначив 28, а 92 віддав
# як «незрозумілі»: дата зазвичай стоїть на сторінці, а не в нашому стислому
# описі. Цей скрипт відкриває саму сторінку джерела й читає її.
#
# Записів, які він розбирає, лишалось 127 — усе типи, що за природою мають
# дату: конкурси, табори, гранти, фестивалі, обміни, олімпіади, стипендії.
# Серед них можуть висіти закриті набори (рішення Марії 11.09.2026).
#
# Запускається в четвер, через три дні після дозаповнення: спершу дешевий
# прохід по тексту, потім дорожчий — по живих сторінках, уже по залишку.
on:
  schedule:
    - cron: '40 3 * * 4'   # чт 03:40 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = писати в базу; false = лише дамп'
        required: false
        default: 'false'
      batch:
        description: 'скільки записів за прогін'
        required: false
        default: '150'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Recheck
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH: ${{ github.event.inputs.batch || '150' }}
        # За розкладом завжди пишемо; вручну — лише якщо попросили apply=true.
        run: |
          if [ "${{ github.event.inputs.apply }}" = "false" ]; then
            python recheck_dates.py
          else
            python recheck_dates.py --apply
          fi
