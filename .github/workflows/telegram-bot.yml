name: Telegram bot — post new opportunities

# ВИМКНЕНО ЗА РОЗКЛАДОМ 19.08.2026. Слав до 8 ОКРЕМИХ повідомлень за запуск
# (MAX_PER_RUN=8) — разом із ранковим дайджестом і нічними метриками підписник
# отримував до 10 сповіщень на добу. Канал тепер має рівно один пост на день:
# тематичний дайджест о 09:00 (scripts/check-deadlines.mjs), куди нові
# можливості потрапляють секцією «нові в каталозі».
# Ручний запуск лишається — інколи треба підняти окрему можливість.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print messages without sending'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Post new opportunities to Telegram
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: 'https://dityam.com.ua'
          MAX_PER_RUN: '1'
          MAX_PER_TYPE: '1'
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/post-to-telegram.mjs
