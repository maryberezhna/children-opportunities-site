name: Увімкнути LLM-воркфлоу після ліміту API

# 14.09.2026 вичерпано місячний ліміт витрат Anthropic API: «You will regain
# access on 2026-10-01 at 00:00 UTC». Підняти ліміт не вийшло, тож воркфлоу,
# які без моделі щодня падають вхолосту, вимкнено до 1 жовтня (рішення Марії).
#
# Цей воркфлоу вмикає їх назад одним запуском (до 04.10.2026 — ще й сам, за
# розкладом; див. нижче). Скрап, автомодерація й пропозиції від людей НЕ
# вимикались: частина їхньої роботи йде без моделі, а сирі знахідки чекають у
# черзі (див. raw_store).
#
# Розкладу більше немає — лише ручний запуск (04.10.2026). Cron '0 1 1 10 *'
# спрацьовував би КОЖНОГО 1 жовтня, а не раз: через рік він мовчки увімкнув би
# вісім LLM-воркфлоу, навіть якщо їх вимкнули свідомо (як після вичерпаного
# балансу 03.10.2026). Вмикати платні воркфлоу має людина, а не календар.
#
# content-agent.yml («Контент на тиждень») тут більше немає: 05.10.2026 Марія
# вимкнула його назовсім — щопонеділка слав в адмінчат однакові чернетки
# Instagram («це жесть»). Instagram тепер готується окремо, партіями з людиною.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Увімкнути
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in discover.yml discover-sources.yml discover-rare.yml process-notes.yml \
                    backfill-deadlines.yml recheck-dates.yml translate-en.yml; do
            if gh workflow enable "$wf" --repo "$REPO"; then
              echo "✓ $wf"
            else
              echo "✗ $wf — не вдалося, увімкнути вручну"
            fi
          done
