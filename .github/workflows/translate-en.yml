name: Translate to English

# Англійська версія записів каталогу. Оригінал лишається джерелом правди:
# доки перекладу немає, сайт показує українське поле, тож прогін можна
# зупинити будь-коли й продовжити наступного разу.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише лог, без запису'
        required: false
        default: 'false'
      batch:
        description: 'скільки записів за прогін'
        required: false
        default: '200'
  schedule:
    # Щоночі о 03:20 UTC — після нічного скрапу, щоб свіжі записи одразу
    # отримали переклад і не висіли українською на англійському сайті.
    - cron: '20 3 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Translate
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          BATCH: ${{ github.event.inputs.batch || '200' }}
        run: python translate_en.py
