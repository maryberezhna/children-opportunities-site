name: Dityam+ — weekly stats to admin

# Щопонеділка 07:00 UTC шле статистику платного бота в адмін-чат.
on:
  # Розклад знято: 07.10.2026 Марія: «в адмінці лише найнеобхідніше — найбільші проблеми, звернення й покупки з сайту».
  # Звіт лишається — за кнопкою Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише лог, не слати'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send Plus stats
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Ціни не задаємо: скрипт бере ті самі запасні 99 / 999, що й
          # lib/wayforpay.js. Тут стояло '79', і дохід у звіті був занижений.
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/plus-stats.mjs --dry-run
          else
            node scripts/plus-stats.mjs
          fi
