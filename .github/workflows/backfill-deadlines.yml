name: Дозаповнення дат (щотижня)

# Дата або періодичність для записів, де їх немає: LLM читає назву й опис,
# ставить deadline / annual / ongoing, мертві чернетки закриває.
# Було лише ручним і востаннє ганялось 16 серпня — за цей час 935 активних
# записів лишились без дати, періоду й періодичності, тобто без жодного
# способу закритись. Тепер щотижня, у понеділок уранці: черга дозаповнення
# більше не накопичується мовчки (рішення Марії 11.09.2026).
on:
  schedule:
    - cron: '15 3 * * 1'   # пн 03:15 UTC, до денних скрапів
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише лог, без запису'
        required: false
        default: 'false'
      batch:
        description: 'скільки записів за прогін'
        required: false
        default: '120'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          BATCH: ${{ github.event.inputs.batch || '250' }}
        run: python backfill_deadlines.py
