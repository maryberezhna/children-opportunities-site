name: Безкоштовно чи платно — перевірка по живих сторінках (manual)

# На сайті вартість — лише «безкоштовно» або «платно» (рішення Марії
# 13.09.2026). Скрипт читає сторінку джерела й ставить одне з двох — лише з
# дослівною цитатою; незрозуміле йде в модерацію з діагнозом.
#
# Поки без розкладу: спершу дамп проміжних записів, людина переглядає,
# тоді apply. scope=all — перегляд решти бази.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = писати в базу; false = лише дамп'
        required: false
        default: 'false'
      scope:
        description: 'in_between = лише проміжні й порожні; all = уся активна база'
        required: false
        default: 'in_between'
      batch:
        description: 'скільки записів за прогін'
        required: false
        default: '150'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Recheck cost
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH: ${{ github.event.inputs.batch || '150' }}
        run: |
          ARGS="--scope ${{ github.event.inputs.scope || 'in_between' }} --limit ${{ github.event.inputs.batch || '150' }}"
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python recheck_cost.py --apply $ARGS
          else
            python recheck_cost.py $ARGS
          fi
