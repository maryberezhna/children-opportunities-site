name: Auto-review черги модерації

# За замовчуванням — ДАМП, не запис. Щоб було видно, що коридори роблять,
# ще до того як їм дозволили писати в базу. Запис вмикається вручну через
# workflow_dispatch з apply=true, коли до рішень судді набереться довіра.
on:
  schedule:
    - cron: '30 6 * * *'   # після нічного скрапу (він о 06:00 UTC)
  workflow_dispatch:
    inputs:
      apply:
        description: 'Реально писати в базу (інакше лише дамп)'
        type: boolean
        default: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Три коридори
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python auto_review.py ${{ inputs.apply && '--apply' || '' }}
