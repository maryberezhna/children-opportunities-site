name: Auto-review черги модерації

# Коридори ПИШУТЬ у базу — рішення Марії 11.09.2026. Три тижні воркфлоу
# ходив у режимі дампу, і цього виявилось достатньо: механіка з суддею
# сходяться, а черга росла тільки тому, що апрувити її не було кому.
# Що саме вмикається: зелений публікує сам, червоний закриває дублі,
# мертві лінки й протерміноване. Жовтий як був — чекає на людину, і туди
# назавжди йдуть чутливі категорії та статусні групи дітей.
# dry_run=true повертає старий режим дампу для одноразової перевірки.
on:
  schedule:
    - cron: '30 6 * * *'   # після нічного скрапу (він о 06:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Лише показати, нічого не писати'
        type: boolean
        default: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Три коридори
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python auto_review.py ${{ inputs.dry_run && '' || '--apply' }}
