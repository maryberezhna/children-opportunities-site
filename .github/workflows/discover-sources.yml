name: Розвідник джерел (тема дня)

# Шукає не можливості, а САЙТИ, які їх публікують. Акцент — українські діти
# за кордоном: фонди, міжнародні організації, діаспорні спільноти.
# У каталог звідси не потрапляє нічого: кандидати лягають у чергу на перегляд,
# джерело заводить людина.
on:
  schedule:
    - cron: '40 5 * * *'   # після агента можливостей (05:00), до скрапу (06:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Лише показати, нічого не писати'
        required: false
        default: 'false'
      theme:
        description: 'Тема замість теми дня'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r requirements.txt

      - name: Шукати джерела
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCOVER_SOURCES_MODEL: ${{ vars.DISCOVER_MODEL }}
          DISCOVER_SOURCES_THEME: ${{ github.event.inputs.theme }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python discover_sources.py
