name: Backfill geo fields (manual)

# Дорозмітка countries / is_international для активних записів моделлю по
# вже збереженому тексту. Дивись scraper/backfill_geo.py — там пояснено, чому
# не регулярка й чому не перескрап. Ключ Anthropic є лише тут, у секретах, —
# локально скрипт не запустити.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише лог, без запису'
        required: false
        default: 'false'
      limit:
        description: 'скільки записів (порожньо = всі)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python backfill_geo.py $ARGS
