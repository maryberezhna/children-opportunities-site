name: Звіт по джерелах (без моделі)

# Що насправді дає кожне джерело: сирі знахідки, збережене, дублі, відхилене і
# причини — по кожному Telegram-каналу й RSS-стрічці окремо. Модель не
# потрібна, тож працює й поки вичерпано ліміт API (14.09–01.10.2026).
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'За скільки днів'
        required: false
        default: '30'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Звіт
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python source_report.py --days ${{ github.event.inputs.days || '30' }}
