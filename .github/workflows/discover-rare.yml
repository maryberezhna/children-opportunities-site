name: Рідкісне за кордоном — можливості й фонди

# Окремий флоу (рішення Марії 14.09.2026): незвичні можливості за кордоном для
# українських дітей або такі, куди вони можуть подаватися; будь-який вік 0–18.
# Зразок — безкоштовний тенісний табір Фонду Марти Костюк в Іспанії.
#
# Дві задачі на спільній машинерії:
# - можливості — discover_agent.py з DISCOVER_PROFILE=rare_abroad → чернетки;
# - фонди й організації — discover_sources.py з профілем foundations → черга джерел.
# Ні те, ні інше нічого не публікує саме: усе йде на модерацію.
on:
  # Розклад знято 24.09.2026 (Марія: «або переформулювати, або вимкнути до
  # кращих часів»). За 30 днів цей флоу не дав ЖОДНОГО запису в каталог:
  # 23.09 — 1 кандидат і 0 драфтів, 0 кандидатів у чергу джерел; при цьому
  # щосереди він витрачав Sonnet 5 плюс веб-пошук на дві задачі одразу.
  # Сам напрям — рідкісне за кордоном — лишається пріоритетом, тож флоу не
  # видалено: запускати руками з темою й регіоном, а повертати в розклад —
  # коли ручні прогони почнуть давати драфти, які доходять до сайту.
  #
  # Було: cron '15 7 * * 3' (щосереди), рішення Марії 14.09.2026.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Лише показати, нічого не писати'
        required: false
        default: 'false'
      keyword:
        description: 'Тема замість теми дня'
        required: false
        default: ''
      region:
        description: 'Регіон замість регіону дня («Іспанія», «США і Канада», «Світ»)'
        required: false
        default: ''
      theme:
        description: 'Тема пошуку фондів замість теми дня'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Рідкісні можливості за кордоном
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DISCOVER_MODEL: ${{ vars.DISCOVER_MODEL }}
          DISCOVER_PROFILE: rare_abroad
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DISCOVER_KEYWORD: ${{ github.event.inputs.keyword }}
          DISCOVER_REGION: ${{ github.event.inputs.region }}
        run: python discover_agent.py

  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Фонди й організації
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCOVER_SOURCES_MODEL: ${{ vars.DISCOVER_MODEL }}
          DISCOVER_SOURCES_PROFILE: foundations
          DISCOVER_SOURCES_THEME: ${{ github.event.inputs.theme }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python discover_sources.py
