name: Audit seed batch (manual)

# Звірка старих записів із їхньою живою сторінкою — див. scraper/audit_seed.py.
# Потрібна для квітневого стартового набору (140 активних записів зі 122
# джерел), який зайшов до появи будь-яких перевірок на вході й тому містить
# програми для студентів, підписані як шкільні.
#
# Ключ Anthropic живе лише в секретах GitHub — локально скрипт не запустити.
# Перший прогін завжди з dry_run=true: висновок ухвалює модель, і подивитись
# на її судження до запису в базу дешевше, ніж відкочувати потім.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише лог, без запису'
        required: false
        default: 'true'
      limit:
        description: 'скільки записів (порожньо = всі)'
        required: false
        default: ''
      created:
        description: 'дата набору YYYY-MM-DD'
        required: false
        default: '2026-04-21'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Audit
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--created ${{ github.event.inputs.created || '2026-04-21' }}"
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python audit_seed.py $ARGS
